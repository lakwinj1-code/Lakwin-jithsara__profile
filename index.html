<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable) {
            var getter = desc.get;
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: desc.enumerable,
              get: getter,
              set: function () {},
            });
          }
        } catch (_) {}

        window.addEventListener(
          'error',
          function (event) {
            var src = (event && event.filename) || '';
            var stack = (event && event.error && event.error.stack) || '';
            if (
              src.indexOf('chrome-extension://') === 0 ||
              stack.indexOf('chrome-extension://') !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
    <title>Personal Link & Portfolio Hub</title>
    <meta name="description" content="An all-in-one personal bio, social media link hub, creative gallery, digital contact card, and direct messaging portfolio." />
